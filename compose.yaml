services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockcore
      POSTGRES_USER: stockcore
      POSTGRES_PASSWORD: stockcore_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stockcore_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockcore -d stockcore"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  stockcore_db:
